plugins {
    id "com.android.application"
}

android {
    namespace "com.fabien.realme.launcherlagguard"
    compileSdk 34

    defaultConfig {
        applicationId "com.fabien.realme.launcherlagguard"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
